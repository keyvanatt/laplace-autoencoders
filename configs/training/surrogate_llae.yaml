# Hyperparamètres pour la phase surrogate LLAE (train_surrogate.py model=llae training=surrogate_llae)
defaults:
  - surrogate_arch

epochs: 300
batch_size: 16
lr_surrogate: 3.0e-4
lr_decoder: 5.0e-5
lr_laplace: 1.0e-5   # utilisé seulement si model.learnable_laplace=true
patience: 40

# Checkpoint AE LLAE à charger
ae_ckpt: checkpoints/llae_best.pt
