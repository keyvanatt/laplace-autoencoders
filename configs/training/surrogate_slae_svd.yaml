# Hyperparamètres pour le surrogate SVD-SLAE (train_surrogate.py model=slae training=surrogate_slae_svd)
# SVD reelle tronquee du mode latent des latents Laplace z_k (reels pour SLAE).
# Base V FIGEE : c'est le cas r_s = K de surrogate_slae_tucker.
defaults:
  - surrogate_arch

epochs: 300
batch_size: 16
lr_surrogate: 5.0e-4
lr_decoder:   5.0e-5
patience: 40

# Nombre de modes SVD retenus pour la compression des latents Laplace
k_svd: 16

# Checkpoint AE SLAE — latent_dim et freq_L sont lus depuis le checkpoint
ae_ckpt: checkpoints/slae_best.pt
