# Hyperparamètres pour le surrogate SVD-LLAE (train_surrogate.py model=llae training=surrogate_llae_svd)
# SVD complexe tronquee du mode latent des codes de Laplace z_hat(s_k).
# Base V FIGEE : c'est le cas r_s = K de surrogate_llae_tucker (mode frequence
# non compresse), donc V est exactement le facteur latent U_z de Tucker.
defaults:
  - surrogate_arch

epochs: 300
batch_size: 16
lr_surrogate: 5.0e-4
lr_decoder:   5.0e-5
patience: 40

# Nombre de modes SVD retenus pour la compression des latents
k_svd: 16

# Checkpoint AE LLAE à charger
ae_ckpt: checkpoints/llae_best.pt
