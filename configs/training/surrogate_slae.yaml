# Hyperparamètres pour la phase surrogate SLAE (train_surrogate.py model=slae training=surrogate_slae)
defaults:
  - surrogate_arch

epochs: 300
batch_size: 16
lr_surrogate: 3.0e-4
lr_decoder: 5.0e-5
patience: 40

# Checkpoint AE SLAE — latent_dim et freq_L sont lus depuis le checkpoint
ae_ckpt: checkpoints/slae_best.pt
