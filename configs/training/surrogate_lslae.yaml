# Hyperparamètres pour la phase surrogate LSLAE (train_surrogate.py model=lslae training=surrogate_lslae)
defaults:
  - surrogate_arch

epochs: 300
batch_size: 16
patience: 40

# Taux d'apprentissage différentiels (surrogate / decoder / base SVD V)
lr_surrogate: 5.0e-4
lr_decoder:   5.0e-5
lr_V:         5.0e-4

# SVD
k_svd: 16       # modes SVD retenus dans la base latente
alpha_lat: 1.0  # poids de la loss latente vs spatiale

# Taille de batch pour l'encodage offline (phase 2)
encode_batch_size: 32

# Checkpoint AE LLAE à charger
ae_ckpt: checkpoints/llae_best.pt
