[project]
name = "laplace-autoencoders"
version = "0.1.0"
description = "Laplace-domain autoencoders for parametric space-time surrogates of parabolic problems"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "adjusttext>=1.4.0",
    "hydra-core>=1.3",
    "joblib>=1.5.3",
    "matplotlib>=3.11.0",
    "numpy>=2.5.0",
    "omegaconf>=2.3",
    "opencv-python-headless>=5.0.0.93",
    "pytorch-lightning>=2.0",
    "scipy>=1.18.0",
    "torch>=2.0",
    "tqdm>=4.68.3",
    "wandb>=0.28.0",
]

[dependency-groups]
remote-control = [
    "paramiko>=5.0.0",
    "rich>=15.0.0",
]
dev = [
    "ipykernel>=7.3.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.10.4",
    "nbstripout>=0.9.1",
    "pytest>=9.1.1",
]
